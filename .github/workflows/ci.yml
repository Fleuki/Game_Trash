name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Правила из PLAN §3.3 проверяются здесь. Нарушил — сборка красная.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
