name: Pages

# Собирает игру и публикует на GitHub Pages, чтобы её можно было пощупать
# с телефона. Ветка — основная в репозитории; при переименовании поправить здесь.
on:
  push:
    branches: [claude/game-creation-plan-z7ufiu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Публикуем по одной сборке за раз, последняя вытесняет предыдущую.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Vite собирает сюда. Пути в сборке относительные (base: './'),
          # поэтому игра работает и в подпапке вида /Game_Trash/.
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
